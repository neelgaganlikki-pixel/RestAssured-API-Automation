# ============================================================
# SELF-HEALING AUTOMATION SYSTEM CONFIGURATION
# ============================================================

# Master switch for self-healing across API and Database testing
SELF_HEALING_ENABLED=true

# Maximum healing attempts per test step
SELF_HEALING_MAX_ATTEMPTS=3

# Confidence threshold required to accept a healed candidate (0.0 to 1.0)
SELF_HEALING_CONFIDENCE_THRESHOLD=0.90

# Whether to persist validated mappings across test runs
SELF_HEALING_SAVE_HISTORY=true

# Logging verbosity level (INFO, DEBUG, WARN, ERROR)
SELF_HEALING_LOG_LEVEL=INFO

# Enable or disable API specific self-healing
API_SELF_HEALING_ENABLED=true

# Enable or disable Database specific self-healing
DB_SELF_HEALING_ENABLED=true

# Path to the persistent healing history file
SELF_HEALING_HISTORY_FILE=reports/healing_history.json

# Directory for generated reports (HTML, JSON)
SELF_HEALING_REPORT_DIR=reports

